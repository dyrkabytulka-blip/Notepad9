[package]
name = "notepad9"
version = "2.1.0"
edition = "2021"
license = "MIT"
description = "Notepad9 - a dark, fast text editor"
build = "build.rs"

[[bin]]
name = "Notepad9"
path = "src/main.rs"

# the example plugins are a workspace of their own (plugins/Cargo.toml): they need panic = "unwind"
[workspace]
members = [".", "plugin-sdk"]
exclude = ["plugins"]

[dependencies]
notepad9_plugin = { path = "plugin-sdk" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
ropey = { version = "1.6", default-features = false, features = ["cr_lines", "simd"] }
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
pulldown-cmark = { version = "0.12", default-features = false }
regex = "1"
arboard = { version = "3", default-features = false }
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
raw-window-handle = "0.6"
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_Graphics_Dwm",
    "Win32_Globalization",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# fine for the editor: every plugin DLL has its own runtime and catches its own panics
panic = "abort"
strip = true

# the editor must stay usable in debug builds
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
